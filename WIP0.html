<h1> Scribes</h1>
<div class="container">
<button type="button" 
onclick="openNextButton('button2')" id="button1">Give a prayer or a word 
an accounting of ink and thought
flour and need.
A map to the world behind the stone arch of pain
and eclipsing light.  </button>

<button type="button" class="hidden" id="button2" onclick="openNextButton('button3')">Whatever the plea, it is a labor.
To fill the sacks and deliver them to their maker,
to take a tally of the haves and wants.</button>
<button type="button" class="hidden" id="button3" onclick="openNextButton('button4')">
Some labors work to the aid of the whole, 
make a window of their strain.
Some, a vein repetition, 
a “diggers luck” 
that polishes a mirror. 
Whatever they have done and will do
I cannot make my sign
in any other way, 
than the way
of those before me.</button>
<button type="button" class="hidden" id="button4" onclick="document.getElementById('textArea5').classList.remove('hidden')">
It’s ritual and breath
protection and emulation
practice for the then, now, 
and what’s to come.

Time is a burst fruit, 
evident 
unable to be pieced together 
in a way that keeps hands clean.

</button>

<textarea id="textArea5" name="future" rows="4" cols="50" class="hidden">
You know something of this mess 
you who stitch together realm and circumstance 
and expect your suture to hold.
</textarea>
</div>

<h2> By Matthew Shenoda</h2>

<h6>Source: Poetry (April 2026)</h6>
